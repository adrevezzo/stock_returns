services:
  - type: web
    name: stock-returns-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    autoDeploy: true