services:
  - type: web
    name: stock-returns-app
    runtime: python
    pythonVersion: 3.11.0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    autoDeploy: true