<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock Returns App{% endblock %}</title>

  {% block styles %}
  <!-- Bootstrap 5 (Bootstrap-Flask uses Bootstrap 5) -->
  {{ bootstrap.load_css() }}

  <!-- Links to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&family=Merriweather&family=Montserrat:wght@100;400;900&family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Sawarabi+Mincho&display=swap" rel="stylesheet">

  <!-- Font Awesome Link -->
  <script src="https://kit.fontawesome.com/b54dfe251e.js" crossorigin="anonymous"></script>

  <!--  Local CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style1.css')}}">
  {% endblock %}

</head>

<body>

{% block navbar %}
  <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="{{url_for('home')}}"><!--<img alt="Brand" src="{{ url_for('static', filename='images/Logo.png')}}">--></a>
      <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        Menu
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('blog') }}">Blog</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
{% endblock %}

  <!-- Main Content -->
  {% block content %}{% endblock %}

  <!-- Bootstrap 5 JavaScript -->
  {% block scripts %}
  {{ bootstrap.load_js() }}
  {% endblock %}

</body>
</html>
